[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-review-studio"
version = "0.1.0"
description = "An inspectable A2A multi-agent review workflow with a Korean web UI"
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk[http-server]==1.1.5",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[tool.setuptools.packages.find]
include = ["review_studio*"]

[tool.setuptools.package-data]
review_studio = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

